<div class="home-container">
  <div class="hero-banner">
    <img src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=1200&q=80" alt="Volunteers" />
  </div>

  <section class="opportunities-section">
    <div class="section-header">Open Opportunities</div>
    <div class="opportunity-card" *ngFor="let item of openOpportunities">
      <div class="card-left">
        <span class="heart-icon">❤️</span>
        <div class="card-info">
          <h3>{{ item.title }}</h3>
          <p>{{ item.date }} - {{ item.location }}</p>
        </div>
      </div>
      <span class="status-badge" [ngClass]="item.statusClass">{{ item.status }}</span>
    </div>
  </section>

  <div class="cta-banner">
    <span class="cta-text">Start Your Journey:</span>
    <button class="cta-button" routerLink="/signup">Sign Up Today!</button>
  </div>
</div>
