<div class="signup-container">
  @if (!isSubmitted()) {
    <div class="signup-card">
      <h1>Sign Up</h1>
      <form (submit)="$event.preventDefault()">
        <label for="name">Name</label>
        <input #name type="text" id="name" placeholder="Enter your name" />

        <label for="email">Email</label>
        <input #email type="email" id="email" placeholder="Enter your email" />

        <label for="password">Password</label>
        <input #password type="password" id="password" placeholder="Enter your password" />

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button type="button" class="create-btn" (click)="createAccount(name.value, email.value, password.value)">
          Create Account
        </button>
      </form>
      <button type="button" class="back-btn" (click)="back()">Back</button>
    </div>
  } @else {
    <div class="confirmation-card">
      <h1>Account Created!</h1>
      <p>Your account has been successfully created.</p>
      <p><strong>Email:</strong> {{ store.account()?.email }}</p>
      @if (store.pending()) {
        <p class="pending-note">You'll be signed up for your event when you continue</p>
        <button class="home-btn" (click)="continue()">Continue to event</button>
      } @else {
        <button class="home-btn" (click)="continue()">Home</button>
      }
    </div>
  }
</div>
