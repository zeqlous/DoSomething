<div class="signup-container">
  <div class="signup-card" *ngIf="!isSubmitted">
    <h1>Sign Up</h1>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" (input)="email = $any($event.target).value" />
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" />

      <button type="button" class="create-btn" (click)="createAccount()">Create Account</button>
    </form>
    <button type="button" class="back-btn" (click)="goHome()">Back</button>
  </div>

  <div class="confirmation-card" *ngIf="isSubmitted">
    <h1>Account Created!</h1>
    <p>Your account has been successfully created.</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <button class="home-btn" (click)="goHome()">Home</button>
  </div>
</div>
