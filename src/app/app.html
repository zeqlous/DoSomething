<header class="navbar">
  <div class="navbar-top">
    <div class="logo">
      <a routerLink="/">DoSomething.com</a>
    </div>

    <div class="user-auth">
      <span class="user-icon">👤</span>
      @if (store.account(); as acct) {
        <a routerLink="/schedule">{{ acct.name }}</a>
        <button class="logout-btn" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/signup">Sign Up</a>
      }
    </div>
  </div>

  <div class="navbar-bottom">
    <a routerLink="/" class="btn-opportunities">Home</a>
    <a routerLink="/schedule" class="calendar-btn" title="Schedule">📅</a>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
